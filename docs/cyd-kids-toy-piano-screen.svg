<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
  <title id="title">CYD Kids Toy Piano screen preview</title>
  <desc id="desc">Rendered preview of the clean kids toy piano interface with five large keys and volume controls.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .small { font: bold 11px Arial, sans-serif; }
      .title { font: bold 19px Arial, sans-serif; }
      .note { font: bold 50px Arial, sans-serif; }
      .hint { font: bold 11px Arial, sans-serif; }
      .vol { font: bold 12px Arial, sans-serif; }
    </style>
  </defs>

  <rect width="320" height="240" fill="#00105f"/>

  <rect x="0" y="0" width="320" height="32" fill="#050509"/>
  <text x="8" y="25" class="title" fill="#fff">Color Piano</text>
  <text x="142" y="23" class="small" fill="#c9ccd4">tap a key</text>

  <text x="202" y="23" class="vol" fill="#31d6ff">VOL</text>
  <rect x="226" y="5" width="22" height="22" rx="4" fill="#555861"/>
  <rect x="292" y="5" width="22" height="22" rx="4" fill="#555861"/>
  <text x="237" y="23" text-anchor="middle" class="title" fill="#fff">-</text>
  <text x="303" y="23" text-anchor="middle" class="title" fill="#fff">+</text>
  <text x="270" y="22" text-anchor="middle" class="vol" fill="#fff">4</text>

  <g filter="url(#shadow)">
    <g>
      <rect x="3" y="36" width="60" height="202" rx="7" fill="#ff4040"/>
      <rect x="7" y="40" width="52" height="194" rx="6" fill="none" stroke="#00bfbf" stroke-width="1.7"/>
      <text x="33" y="122" text-anchor="middle" class="note" fill="#fff">C</text>
      <text x="33" y="164" text-anchor="middle" class="hint" fill="#fff">home</text>
      <rect x="12" y="212" width="42" height="14" rx="5" fill="#00bfbf"/>
    </g>

    <g>
      <rect x="67" y="36" width="60" height="202" rx="7" fill="#ffa028"/>
      <rect x="71" y="40" width="52" height="194" rx="6" fill="none" stroke="#005fd7" stroke-width="1.7"/>
      <text x="97" y="122" text-anchor="middle" class="note" fill="#fff">D</text>
      <text x="97" y="164" text-anchor="middle" class="hint" fill="#fff">step</text>
      <rect x="76" y="212" width="42" height="14" rx="5" fill="#005fd7"/>
    </g>

    <g>
      <rect x="131" y="36" width="60" height="202" rx="7" fill="#faeb32"/>
      <rect x="135" y="40" width="52" height="194" rx="6" fill="none" stroke="#0514cd" stroke-width="1.7"/>
      <text x="161" y="122" text-anchor="middle" class="note" fill="#111">E</text>
      <text x="161" y="164" text-anchor="middle" class="hint" fill="#111">bright</text>
      <rect x="140" y="212" width="42" height="14" rx="5" fill="#0514cd"/>
    </g>

    <g>
      <rect x="195" y="36" width="60" height="202" rx="7" fill="#46d278"/>
      <rect x="199" y="40" width="52" height="194" rx="6" fill="none" stroke="#b92d87" stroke-width="1.7"/>
      <text x="225" y="122" text-anchor="middle" class="note" fill="#fff">G</text>
      <text x="225" y="164" text-anchor="middle" class="hint" fill="#fff">lift</text>
      <rect x="204" y="212" width="42" height="14" rx="5" fill="#b92d87"/>
    </g>

    <g>
      <rect x="259" y="36" width="58" height="202" rx="7" fill="#5091ff"/>
      <rect x="263" y="40" width="50" height="194" rx="6" fill="none" stroke="#af6e00" stroke-width="1.7"/>
      <text x="288" y="122" text-anchor="middle" class="note" fill="#fff">A</text>
      <text x="288" y="164" text-anchor="middle" class="hint" fill="#fff">spark</text>
      <rect x="268" y="212" width="40" height="14" rx="5" fill="#af6e00"/>
    </g>
  </g>
</svg>
