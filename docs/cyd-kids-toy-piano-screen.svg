<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
  <title id="title">CYD Kids Toy Piano screen preview</title>
  <desc id="desc">A rendered preview of the ESP32 Cheap Yellow Display toy piano interface with five colored keys.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .small { font: 8px Arial, sans-serif; }
      .label { font: bold 12px Arial, sans-serif; }
      .note { font: bold 40px Arial, sans-serif; }
      .hint { font: bold 11px Arial, sans-serif; }
      .dev { font: 7px monospace; }
    </style>
  </defs>

  <rect width="320" height="240" fill="#00105f"/>

  <rect x="0" y="0" width="320" height="42" fill="#050509"/>
  <text x="10" y="25" class="label" font-size="18" fill="#fff">Color Piano</text>
  <text x="210" y="17" class="small" fill="#31d6ff">5 happy notes</text>
  <text x="10" y="37" class="small" fill="#c9ccd4">Tap keys: sound + matching LED color</text>

  <g filter="url(#shadow)">
    <g>
      <rect x="8" y="58" width="56" height="118" rx="6" fill="#ff4040"/>
      <rect x="11" y="61" width="50" height="112" rx="5" fill="none" stroke="#00bfbf" stroke-width="1.5"/>
      <text x="36" y="111" text-anchor="middle" class="note" fill="#fff">C</text>
      <text x="36" y="141" text-anchor="middle" class="hint" fill="#fff">home</text>
      <rect x="17" y="154" width="38" height="14" rx="5" fill="#00bfbf"/>
    </g>

    <g>
      <rect x="70" y="58" width="56" height="118" rx="6" fill="#ffa028"/>
      <rect x="73" y="61" width="50" height="112" rx="5" fill="none" stroke="#005fd7" stroke-width="1.5"/>
      <text x="98" y="111" text-anchor="middle" class="note" fill="#fff">D</text>
      <text x="98" y="141" text-anchor="middle" class="hint" fill="#fff">step</text>
      <rect x="79" y="154" width="38" height="14" rx="5" fill="#005fd7"/>
    </g>

    <g>
      <rect x="132" y="58" width="56" height="118" rx="6" fill="#faeb32"/>
      <rect x="135" y="61" width="50" height="112" rx="5" fill="none" stroke="#0514cd" stroke-width="1.5"/>
      <text x="160" y="111" text-anchor="middle" class="note" fill="#111">E</text>
      <text x="160" y="141" text-anchor="middle" class="hint" fill="#111">bright</text>
      <rect x="141" y="154" width="38" height="14" rx="5" fill="#0514cd"/>
    </g>

    <g>
      <rect x="194" y="58" width="56" height="118" rx="6" fill="#46d278"/>
      <rect x="197" y="61" width="50" height="112" rx="5" fill="none" stroke="#b92d87" stroke-width="1.5"/>
      <text x="222" y="111" text-anchor="middle" class="note" fill="#fff">G</text>
      <text x="222" y="141" text-anchor="middle" class="hint" fill="#fff">lift</text>
      <rect x="203" y="154" width="38" height="14" rx="5" fill="#b92d87"/>
    </g>

    <g>
      <rect x="256" y="58" width="56" height="118" rx="6" fill="#5091ff"/>
      <rect x="259" y="61" width="50" height="112" rx="5" fill="none" stroke="#af6e00" stroke-width="1.5"/>
      <text x="284" y="111" text-anchor="middle" class="note" fill="#fff">A</text>
      <text x="284" y="141" text-anchor="middle" class="hint" fill="#fff">spark</text>
      <rect x="265" y="154" width="38" height="14" rx="5" fill="#af6e00"/>
    </g>
  </g>

  <rect x="0" y="180" width="320" height="19" fill="#00105f"/>
  <text x="10" y="193" class="label" fill="#fff">Complementary colors are color opposites.</text>

  <rect x="0" y="199" width="320" height="41" fill="#050505"/>
  <text x="8" y="218" class="label" fill="#28ff69">DEV</text>
  <text x="48" y="212" class="dev" fill="#c8c8c8">ready: tap a piano key</text>
  <text x="48" y="223" class="dev" fill="#c8c8c8">note C tone=523 vol=92</text>
  <text x="48" y="234" class="dev" fill="#c8c8c8">note G tone=784 vol=118</text>
</svg>
