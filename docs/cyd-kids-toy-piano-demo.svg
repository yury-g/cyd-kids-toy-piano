<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title description">
<title id="title">CYD Color Piano — animated hardware demo</title>
<desc id="description">A yellow ESP32 Cheap Yellow Display with five colorful piano keys. C, D, E, G and A press in a repeating sequence while a rear RGB glow follows each note and holds its last color between notes. This is a silent, non-interactive illustration. Reduced motion shows a still image.</desc>
<!-- Self-contained SVG image: no JavaScript, external assets, fonts, or links.
     12-second loop: C D E G A G E D C, then rest. Values match src/main.cpp.
     Rear LED colors use the firmware's separate RGB calibration. -->
<defs>
  <radialGradient id="backdrop"><stop stop-color="#252c29"/><stop offset="1" stop-color="#111315"/></radialGradient>
  <filter id="glow" x="-50%" y="-70%" width="200%" height="240%"><feGaussianBlur stdDeviation="32"/></filter>
  <filter id="board-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-opacity=".6"/></filter>
  <filter id="screen-light" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="screen-clip"><rect width="320" height="240" rx="2"/></clipPath>
  <style>
text { font-family: Arial, Helvetica, sans-serif; }
.mono { font-family: monospace; }
.key { transform: translateY(0); }
.press-ring, .note-status { opacity: 0; }
.led { fill: #ff0000; animation: led-colors 12s step-end infinite; }
.progress { transform: scaleX(0); animation: progress 12s linear infinite; }
@keyframes progress { to { transform: scaleX(1); } }
@keyframes led-colors {
  0.0000% { fill: #ff0000; }
  8.3333% { fill: #ff5a00; }
  16.6667% { fill: #82ff00; }
  25.0000% { fill: #00ff00; }
  33.3333% { fill: #0050ff; }
  41.6667% { fill: #00ff00; }
  50.0000% { fill: #82ff00; }
  58.3333% { fill: #ff5a00; }
  66.6667% { fill: #ff0000; }
  100% { fill: #ff0000; }
}
.key-0 { animation: press-0 12s linear infinite; }
.ring-0, .status-0 { animation: show-0 12s step-end infinite; }
@keyframes press-0 {
  0%, 100% { transform: translateY(0); }
  0.0000% { transform: translateY(0); }
  0.7500%, 5.4167% { transform: translateY(8px); }
  6.5000% { transform: translateY(0); }
  66.6667% { transform: translateY(0); }
  67.4167%, 72.0833% { transform: translateY(8px); }
  73.1667% { transform: translateY(0); }
}
@keyframes show-0 {
  0%, 100% { opacity: 0; }
  0.0000% { opacity: 1; }
  6.5000% { opacity: 0; }
  66.6667% { opacity: 1; }
  73.1667% { opacity: 0; }
}
.key-1 { animation: press-1 12s linear infinite; }
.ring-1, .status-1 { animation: show-1 12s step-end infinite; }
@keyframes press-1 {
  0%, 100% { transform: translateY(0); }
  8.3333% { transform: translateY(0); }
  9.0833%, 13.7500% { transform: translateY(8px); }
  14.8333% { transform: translateY(0); }
  58.3333% { transform: translateY(0); }
  59.0833%, 63.7500% { transform: translateY(8px); }
  64.8333% { transform: translateY(0); }
}
@keyframes show-1 {
  0%, 100% { opacity: 0; }
  8.3333% { opacity: 1; }
  14.8333% { opacity: 0; }
  58.3333% { opacity: 1; }
  64.8333% { opacity: 0; }
}
.key-2 { animation: press-2 12s linear infinite; }
.ring-2, .status-2 { animation: show-2 12s step-end infinite; }
@keyframes press-2 {
  0%, 100% { transform: translateY(0); }
  16.6667% { transform: translateY(0); }
  17.4167%, 22.0833% { transform: translateY(8px); }
  23.1667% { transform: translateY(0); }
  50.0000% { transform: translateY(0); }
  50.7500%, 55.4167% { transform: translateY(8px); }
  56.5000% { transform: translateY(0); }
}
@keyframes show-2 {
  0%, 100% { opacity: 0; }
  16.6667% { opacity: 1; }
  23.1667% { opacity: 0; }
  50.0000% { opacity: 1; }
  56.5000% { opacity: 0; }
}
.key-3 { animation: press-3 12s linear infinite; }
.ring-3, .status-3 { animation: show-3 12s step-end infinite; }
@keyframes press-3 {
  0%, 100% { transform: translateY(0); }
  25.0000% { transform: translateY(0); }
  25.7500%, 30.4167% { transform: translateY(8px); }
  31.5000% { transform: translateY(0); }
  41.6667% { transform: translateY(0); }
  42.4167%, 47.0833% { transform: translateY(8px); }
  48.1667% { transform: translateY(0); }
}
@keyframes show-3 {
  0%, 100% { opacity: 0; }
  25.0000% { opacity: 1; }
  31.5000% { opacity: 0; }
  41.6667% { opacity: 1; }
  48.1667% { opacity: 0; }
}
.key-4 { animation: press-4 12s linear infinite; }
.ring-4, .status-4 { animation: show-4 12s step-end infinite; }
@keyframes press-4 {
  0%, 100% { transform: translateY(0); }
  33.3333% { transform: translateY(0); }
  34.0833%, 38.7500% { transform: translateY(8px); }
  39.8333% { transform: translateY(0); }
}
@keyframes show-4 {
  0%, 100% { opacity: 0; }
  33.3333% { opacity: 1; }
  39.8333% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .key, .press-ring, .note-status, .led, .progress { animation: none; }
  .progress { transform: scaleX(1); }
}
  </style>
